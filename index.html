/* GLITCH TITLE */
.glitch {
    position: relative;
    font-size: 36px;
    color: red;
    text-shadow: 0 0 10px red;
    animation: flicker 2s infinite;
}
.glitch::before, .glitch::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    width: 100%;
    opacity: 0.8;
}
.glitch::before {
    color: #0f0;
    animation: glitchTop 1.5s infinite linear;
}
.glitch::after {
    color: #f00;
    animation: glitchBottom 1.2s infinite linear;
}

@keyframes glitchTop {
    0% { transform: translate(2px, -2px); }
    50% { transform: translate(-2px, 2px); }
    100% { transform: translate(2px, -2px); }
}
@keyframes glitchBottom {
    0% { transform: translate(-2px, 2px); }
    50% { transform: translate(2px, -2px); }
    100% { transform: translate(-2px, 2px); }
}
@keyframes flicker {
    0%,100% { opacity:1; }
    50% { opacity:0.85; }
}

<script>
/* MATRIX ENGINE */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const letters = "01BYTEXHACKSYSTEM";
const fontSize = 14;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);

let matrixColor = "red";
let speed = 35;
let interval;

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = matrixColor;
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
            drops[i] = 0;

        drops[i]++;
    }
}

function startMatrix() {
    clearInterval(interval);
    interval = setInterval(drawMatrix, speed);
}
startMatrix();

/* CONTROLS */
function toggleColor() {
    matrixColor = (matrixColor === "red") ? "#00ff00" : "red";
}
function changeSpeed(val) {
    speed = val;
    startMatrix();
}

/* SOUND */
const sound = document.getElementById("bgSound");
let soundOn = false;
function toggleSound() {
    if (!soundOn) {
        sound.play().catch(()=>{});
        soundOn = true;
    } else {
        sound.pause();
        soundOn = false;
    }
}
</script>
